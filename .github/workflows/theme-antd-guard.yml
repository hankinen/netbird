name: Theme AntD guard

# Guards the theme layer (src/theme, withAntdTheme):
#   selectors : class-name selectors still match upstream components
#   dark      : dark theme vs the PR target / previous commit (changes reviewed)
#   light     : AntD theme vs the PR target / previous commit (changes reviewed)
#   mobile    : no new sideways page overflow, split in two parallel jobs so
#               each stays well inside its timeout: phone (375/390/768 light,
#               390 dark, 360 detail pages) and desktop (1280/1440 light,
#               the sider open)
#   legibility: the Control Center canvas keeps its text readable at the
#               default fit (>= 12px on screen, no node under the chrome) at
#               1280/1440 in both colour modes, same Storybook build (runs in
#               the desktop half of the mobile job)
#
# Branch model: upstream netbirdio/dashboard main -> dev (our single main
# branch, zh-CN translations + this theme together).
#
# Baseline for both themes: the PR base, else the commit before the push,
# else HEAD~1. The baseline is built from its own commit as-is (stories and
# .storybook config included), so a story added or moved since then shows
# up as only-current instead of breaking the baseline build. Since P0 of the UI
# architecture (docs/plans/2026-10-17-enterprise-ui-architecture.md,
# decision 4) the dark theme is no longer held to upstream pixel parity:
# a dark change fails the job like a light one and is reviewed from the
# uploaded shots.
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-antd-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selectors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/theme/check-selectors.mjs --verbose

  visual:
    needs: selectors
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        theme: [dark, light]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Resolve baseline
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Both themes compare with the previous approved state (see header):
          # dark must not change at all, light only where intended.
          BASE="${PR_BASE:-$BEFORE}"
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] ||
             ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "Baseline: $(git log --oneline -1 "$BASE")"
      - name: Visual guard (${{ matrix.theme }})
        env:
          OUT: ${{ github.workspace }}/.theme-guard/${{ matrix.theme }}
          THEME_GUARD_CACHE: ${{ runner.temp }}/theme-guard
        # Both themes: any changed story fails the job so a reviewer looks at
        # the uploaded shots and approves the intended ones.
        run: scripts/theme/visual-guard.sh --base "$BASE" --theme ${{ matrix.theme }}
      - name: Summary
        if: always()
        run: |
          R=.theme-guard/${{ matrix.theme }}/report.json
          [ -f "$R" ] && node -e '
            const r=require("./'"$R"'");
            console.log(`### ${process.argv[1]}: identical ${r.identical}, changed ${r.changed.length}, unreadable ${r.unreadable.length}, masked ${r.masked.length}`);
            for (const c of r.changed.slice(0,200)) console.log(`- \`${c.id}\` ${c.reason}`);
          ' "${{ matrix.theme }}" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: theme-guard-${{ matrix.theme }}
          path: .theme-guard/${{ matrix.theme }}
          if-no-files-found: ignore
          retention-days: 14

  mobile:
    needs: selectors
    runs-on: ubuntu-latest
    # One job ran ~24 min of passes plus ~6 min setup and hit 30 min once the
    # desktop widths were added; split, each half needs about 18 / 12 min.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - widths: phone
            args: --desktop-vp ""
          - widths: desktop
            args: --vp "" --dark-vp "" --narrow-vp ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      # Fails when a page story scrolls sideways more than mobile-allow.json
      # allows, at phone, tablet and desktop widths.
      - name: Overflow guard (${{ matrix.widths }})
        run: node scripts/theme/mobile-guard.mjs ${{ matrix.args }}
      # Reuses the build above: the canvas' smallest on-screen text at the
      # default fit must stay >= 12px (graph-legibility-allow.json lists the
      # views still below it, which may only improve) and no node may sit
      # under the chrome row or the dock. Desktop widths, so the desktop half.
      - name: Graph legibility
        if: matrix.widths == 'desktop'
        run: node scripts/theme/graph-legibility.mjs --storybook .theme-guard/mobile/storybook
