# Security headers for every response class. nginx does not inherit add_header
# into a location that defines its own, so every location includes this file.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Generated at container start by gen_runtime_config.sh.
include /run/netbird-dashboard/nginx/csp.conf;
