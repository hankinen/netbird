server {
	listen 80 default_server;
	listen [::]:80 default_server;

    root /usr/share/nginx/html;
    index index.html;
    # Relative Location headers: the container usually sits behind a proxy on
    # another host/port, so nginx must not build absolute redirect URLs.
    absolute_redirect off;
    # Serve build-time .gz siblings when present (scripts/build/precompress.mjs).
    gzip_static on;

    # Cache policy (see docker/README.md):
    #   HTML, *.txt route payloads, /runtime-config.json  -> no-store
    #   /_next/static/**, /assets/chunk.<hash>.js          -> immutable, plain 404
    #   other public files (svg, css, wasm, ...)           -> no-cache (ETag)

    # OIDC callback routes (AUTH_REDIRECT_URI / AUTH_SILENT_REDIRECT_URI paths),
    # generated at start so callbacks get a 200 instead of the 404 page.
    include /run/netbird-dashboard/nginx/redirects.conf;

    location = /runtime-config.json {
        alias /run/netbird-dashboard/runtime-config.json;
        default_type application/json;
        include /etc/nginx/snippets/html.conf;
    }

    # Generated only when NETBIRD_ALLOW_SEARCH_INDEXING=true; the build ships
    # a robots.txt that disallows everything.
    location = /robots.txt {
        root /run/netbird-dashboard;
        try_files $uri @build_file;
        include /etc/nginx/snippets/no-cache.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /_next/static/ {
        try_files $uri @static_pool;
        include /etc/nginx/snippets/immutable.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~ "^/assets/chunk\.[0-9a-f]{8}\.js$" {
        try_files $uri @static_pool;
        include /etc/nginx/snippets/immutable.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Hashed assets of previous releases, so pages that are still open keep
    # loading their lazy chunks after a deploy. Optional, mounted read-only.
    location @static_pool {
        root /usr/share/nginx/static-pool;
        try_files $uri @asset_404;
        include /etc/nginx/snippets/immutable.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /netbird.wasm {
        default_type application/wasm;
        try_files $uri @asset_404;
        include /etc/nginx/snippets/no-cache.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /ironrdp-pkg/ironrdp_web_bg.wasm {
        default_type application/wasm;
        try_files $uri @asset_404;
        include /etc/nginx/snippets/no-cache.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~* "\.(?:css|js|mjs|map|svg|png|jpe?g|gif|ico|webp|avif|woff2?|ttf|wasm)$" {
        try_files $uri @asset_404;
        include /etc/nginx/snippets/no-cache.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location @build_file {
        root /usr/share/nginx/html;
        try_files $uri @asset_404;
        include /etc/nginx/snippets/no-cache.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # A missing script or style must fail as a real 404, never as the HTML
    # 404 page (which the browser would try to execute and cache).
    location @asset_404 {
        types { }
        default_type text/plain;
        include /etc/nginx/snippets/html.conf;
        return 404 "Not Found\n";
    }

    location / {
        # /peers/ -> /peers (a static export has no directory index pages)
        rewrite ^(.+)/$ $1 permanent;
        try_files $uri $uri.html $uri/index.html =404;
        include /etc/nginx/snippets/html.conf;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/html.conf;
    }
}
